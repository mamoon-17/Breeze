services:
  server:
    container_name: breeze_server
    build:
      dockerfile: Dockerfile.dev
      context: ./backend
    volumes:
      - ./backend:/app
      - node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - 3000:3000
  client:
    container_name: breeze_client
    build:
      dockerfile: Dockerfile.dev
      context: ./frontend
    ports:
      - 5173:5173
    env_file:
      - ./frontend/.env
  redis:
    image: redis:alpine
    container_name: redis_server
    restart: unless-stopped
    volumes:
      - breeze_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

volumes:
  breeze_redis_data:
  node_modules:
